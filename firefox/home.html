<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Co-pilot</title>

<link rel="stylesheet" href="theme.css"><style>
.w{padding:20px 14px}h1{font:700 24px/1.1 var(--disp);margin:4px 0 4px;letter-spacing:-.4px}.lead{color:var(--mute);font-size:12px;margin:0 0 18px}
.mode{display:block;width:100%;text-align:left;background:var(--panel);border:0;border-radius:var(--r);padding:18px 16px;margin-bottom:12px;cursor:pointer;color:inherit;font:inherit;box-shadow:var(--shadow);transition:transform .1s}
.mode:hover{transform:translateY(-1px)}.mode .t{font:600 18px/1 var(--disp);display:flex;justify-content:space-between;align-items:center}.mode .t span{display:inline-flex;color:var(--link)}
.mode .d{color:var(--mute);font-size:12px;margin-top:8px}.mode .s{font-size:12px;margin-top:10px;color:var(--good-ink);font-weight:500}
.mode.last{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
</style></head>
<body><div class="w">
<h1>Fantasy co-pilot</h1><p class="lead" id="lgList">Your Yahoo fantasy basketball leagues</p>
<button class="mode" id="mSeason"><div class="t">In season <span><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></div><div class="d">Weekly matchup plan, pickups and lineups for both leagues. Syncs Yahoo and Basketball Monster for you.</div><div class="s" id="sSeason"></div></button>
<button class="mode" id="mDraft"><div class="t">Draft <span><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></div><div class="d">Live draft room helper: best available, punt strategy and next-pick focus.</div><div class="s" id="sDraft"></div></button>
</div><script src="home.js"></script></body></html>
